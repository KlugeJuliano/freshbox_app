name: freshbox_app
description: App white-label para hortifrutis
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Estado ────────────────────────────────────────────────
  # Gerenciamento de estado e injeção de dependência
  get_it: ^9.2.1
  flutter_bloc: ^9.1.1  # gerador de providers (@bloc)

  # ── Modelos ───────────────────────────────────────────────
  # Imutabilidade, copyWith, fromJson/toJson gerados
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # ── Navegação ─────────────────────────────────────────────
  go_router: ^17.3.0             # roteamento declarativo com guards

  # ── Rede ──────────────────────────────────────────────────
  dio: ^5.5.0                    # cliente HTTP com interceptors
  pretty_dio_logger: ^1.3.1      # log de requests em dev

  # ── Imagens ───────────────────────────────────────────────
  cached_network_image: ^3.3.1   # cache de imagens + placeholder
  flutter_image_compress: ^2.2.0 # compressão antes do upload
  image_picker: ^1.1.2           # câmera / galeria

  # ── Storage local ─────────────────────────────────────────
  shared_preferences: ^2.3.2     # persistência do carrinho e token

  # ── UI / UX ───────────────────────────────────────────────
  shimmer: ^3.0.0                # skeleton loading nos grids
  carousel_slider: ^5.0.0        # banner carousel da home
  smooth_page_indicator: ^2.0.1  # dots do carousel
  badges: ^3.1.2                 # contador no ícone do carrinho
  flutter_svg: ^2.0.10+1         # ícones SVG das categorias

  # ── Links externos ────────────────────────────────────────
  url_launcher: ^6.3.0           # abrir WhatsApp e links externos

  # ── Formatação ────────────────────────────────────────────
  intl: ^0.20.3                  # formatação de moeda (R$ 5,99)

  # ── Formulários ───────────────────────────────────────────
  mask_text_input_formatter: ^2.9.0  # máscara de telefone e CEP

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Geradores de código (rodar: dart run build_runner build)
  build_runner: ^2.4.11
  freezed: ^3.2.3                # gera .freezed.dart
  json_serializable: ^6.8.0      # gera .g.dart (fromJson/toJson)

  # Testes
  mocktail: ^1.0.4               # mocks para unit tests

flutter:
  uses-material-design: true